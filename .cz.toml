[tool.commitizen]
name = "cz_customize"
use_shortcuts = true
message_length_limit = 72
allowed_prefixes = []

[tool.commitizen.customize]
message_template = "{{change_type}}{% if scope %}({{scope}}){% endif %}{% if is_breaking_change %}!{% endif %}: {{subject}}{% if body %}\n\n{{body}}{% endif %}{% if footer %}\n\n{{footer}}{% endif %}"
example = "feat(source): add a Kafka event source"
schema = "<type>[optional scope][!]: <description>"
schema_pattern = "(?s)^(?=[^\\n]{1,72}(?:\\n|$))(feat|fix|docs|style|refactor|perf|test|build|ci|revert)(\\([a-z0-9][a-z0-9._/-]*\\))?(!)?: [^\\n]+(?:\\n\\n.+)?$"
info = """
Commits must use Conventional Commits with one of these types:
feat, fix, docs, style, refactor, perf, test, build, ci, or revert.

The chore type is intentionally not supported. Scopes are optional. Add ! before
the colon and a BREAKING CHANGE footer when a change breaks compatibility.
"""

[[tool.commitizen.customize.questions]]
type = "select"
name = "change_type"
message = "Select the type of change"
choices = [
  { value = "feat", name = "feat: A new feature", key = "f" },
  { value = "fix", name = "fix: A bug fix", key = "x" },
  { value = "docs", name = "docs: Documentation only", key = "d" },
  { value = "style", name = "style: Formatting without behavior changes", key = "s" },
  { value = "refactor", name = "refactor: A code change that is not a feature or fix", key = "r" },
  { value = "perf", name = "perf: A performance improvement", key = "p" },
  { value = "test", name = "test: Add or correct tests", key = "t" },
  { value = "build", name = "build: Build system or dependency changes", key = "b" },
  { value = "ci", name = "ci: Continuous integration changes", key = "c" },
  { value = "revert", name = "revert: Revert a previous change", key = "v" },
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "scope"
message = "Scope (optional, lowercase)"

[[tool.commitizen.customize.questions]]
type = "confirm"
name = "is_breaking_change"
message = "Is this a breaking change?"
default = false

[[tool.commitizen.customize.questions]]
type = "input"
name = "subject"
message = "Short description"

[[tool.commitizen.customize.questions]]
type = "input"
name = "body"
message = "Longer description (optional)"
multiline = true

[[tool.commitizen.customize.questions]]
type = "input"
name = "footer"
message = "Footer, for example BREAKING CHANGE or issue reference (optional)"
multiline = true
